            <!-- PREMIUM -->
            <div class="premium-box">

                <h2>
                    <img src="https://img.icons8.com/parakeet-line/20/ffffff/crown.png" alt="coroa">
                    Seja Premium

                <p>
                    Tenha acesso exclusivo, sem anúncios e com qualidade máxima!
                </p>

                <button>Assine agora</button>

            </div>
        </div>

    <section class="container-card">

        <div class="card">

            <section class="slide">
                <figure>
                    <img src="./Frontend/Assets/IMG/SoloLeving.png" alt="anime">

                    <figcaption>
                        <span class="dest">EM ALTA</span>

                        <h1>Solo Leveling</h1>

                        <p class="solo-p">
                            O CAÇADOR MAIS FORTE DESPERTA.
                        </p>

                        <p class="solo-p1">
                            Eles dizem que o que não te mata te deixa mais forte,
                            mas esse não é o caso do caçador mais fraco de todos.
                        </p>

                        <div class="buttons">
                            <a href="#" class="button-assistir">
                                <i class='bx bx-play'></i>
                                Assistir Agora
                            </a>

                            <a href="#" class="saiba">
                                Mais Informações
                            </a>
                        </div>

                    </figcaption>

                </figure>
            </section>

            <section class="slide">
                <figure>
                    <img src="./Frontend/Assets/IMG/jujutsu.jpg" alt="anime">

                    <figcaption>
                        <span class="dest">EM ALTA</span>
                        <h1>Jujutsu Kaisen</h1>

                        <p class="solo-p">
                            O MUNDO DAS MALDIÇÕES.
                        </p>

                        <p class="solo-p1">
                            Yuji Itadori entra em um universo onde energia amaldiçoada e exorcistas definem a
                            sobrevivência.
                            Uma batalha intensa entre humanos e criaturas sobrenaturais.
                        </p>

                        <div class="buttons">
                            <a href="#" class="button-assistir">
                                <i class='bx bx-play'></i>
                                Assistir Agora
                            </a>

                            <a href="#" class="saiba">
                                Mais Informações
                            </a>
                        </div>
                    </figcaption>
                </figure>
            </section>

            <section class="slide">
                <figure>
                    <img src="./Frontend/Assets/IMG//Re-zero.jpg" alt="anime">

                    <figcaption>
                        <span class="dest">EM ALTA</span>
                        <h1>RE Zero</h1>

                        <p class="solo-p">
                            RECOMEÇAR DÓI.
                        </p>

                        <p class="solo-p1">
                            Subaru descobre que pode voltar no tempo após morrer, mas cada escolha traz dor e
                            consequências.
                            Um ciclo cruel de sofrimento e sobrevivência.
                        </p>

                        <div class="buttons">
                            <a href="#" class="button-assistir">
                                <i class='bx bx-play'></i>
                                Assistir Agora
                            </a>

                            <a href="#" class="saiba">
                                Mais Informações
                            </a>
                        </div>
                    </figcaption>
                </figure>
            </section>

            <section class="slide">
                <figure>
                    <img src="./Frontend/Assets/IMG/Naruto.jpg" alt="anime">

                    <figcaption>
                        <span class="dest">EM ALTA</span>
                        <h1>Naruto </h1>

                        <p class="solo-p">
                            O SONHO DE UM NINJA.
                        </p>

                        <p class="solo-p1">
                            Naruto Uzumaki luta para ser reconhecido enquanto enfrenta desafios, inimigos e seu próprio
                            destino.
                            Uma jornada de superação e amizade.
                        </p>

                        <div class="buttons">
                            <a href="#" class="button-assistir">
                                <i class='bx bx-play'></i>
                                Assistir Agora
                            </a>

                            <a href="#" class="saiba">
                                Mais Informações
                            </a>
                        </div>
                    </figcaption>
                </figure>
            </section>

            <section class="slide">
                <figure>
                    <img src="./Frontend/Assets/IMG/demon-slayer.jpg" alt="anime">

                    <figcaption>
                        <span class="dest">EM ALTA</span>
                        <h1>Demon Slayer</h1>

                        <p class="solo-p">
                            CAÇADOR DE DEMÔNIOS.
                        </p>

                        <p class="solo-p1">
                            Tanjiro Kamado busca salvar sua irmã e derrotar demônios em um mundo sombrio e perigoso.
                            Uma história de dor, coragem e vingança.
                        </p>

                        <div class="buttons">
                            <a href="#" class="button-assistir">
                                <i class='bx bx-play'></i>
                                Assistir Agora
                            </a>

                            <a href="#" class="saiba">
                                Mais Informações
                            </a>

                    </figcaption>
                </figure>
