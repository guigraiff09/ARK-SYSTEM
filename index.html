    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // 1. Menu Hambúrguer (Mobile)
            const btnHamburguer = document.getElementById('btn-hamburguer');
            const sidebar = document.getElementById('sidebar');

            if (btnHamburguer && sidebar) {
                btnHamburguer.addEventListener('click', () => {
                    sidebar.classList.toggle('active');
                });
            }

            // 2. Carrossel Principal (Passagem Automática de Slides)
            const mainCarousel = document.getElementById('main-carousel');
            const mainSlides = document.querySelectorAll('.container-card .slide');
            let currentSlide = 0;

            function nextSlide() {
                if (!mainCarousel || mainSlides.length === 0) return;
                currentSlide = (currentSlide + 1) % mainSlides.length;
                mainCarousel.style.transform = `translateX(-${currentSlide * 100}%)`;
            }

            // Transição a cada 5 segundos
            setInterval(nextSlide, 5000);

            // 3. Slider de Cards Inferior (Botões Próximo / Anterior)
            const cardsContainer = document.getElementById('cardsContainer');
            const prevBtn = document.getElementById('prevCardBtn');
            const nextBtn = document.getElementById('nextCardBtn');

            if (cardsContainer && prevBtn && nextBtn) {
                const scrollAmount = 240; // Distância de rolagem ao clicar nos botões

                nextBtn.addEventListener('click', () => {
                    cardsContainer.scrollBy({
                        left: scrollAmount,
                        behavior: 'smooth'
                    });
                });

                prevBtn.addEventListener('click', () => {
                    cardsContainer.scrollBy({
                        left: -scrollAmount,
                        behavior: 'smooth'
                    });
                });
            }
        });
    </script>
